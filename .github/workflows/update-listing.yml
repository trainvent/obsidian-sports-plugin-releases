name: Update listing after publication
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: update-listing
  cancel-in-progress: false
jobs:
  update:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Promote public release files to the listing
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          current=$(node -p 'require("./manifest.json").version')
          latest=$(printf '%s\n' "$current" "$RELEASE_TAG" | sort -V | tail -n1)
          if [ "$latest" != "$RELEASE_TAG" ]; then exit 0; fi
          git restore --source="refs/tags/$RELEASE_TAG" --worktree --staged .
          test "$(node -p 'require("./manifest.json").version')" = "$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish listing for $RELEASE_TAG"
          git push origin HEAD:main
